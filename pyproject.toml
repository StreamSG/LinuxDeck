[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "linuxdeck"
version = "1.0.0"
description = "Open-source Linux daemon, hardware auto-configurer, and PyQt6 Control Center for Loupedeck Live & Razer Stream Controller"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "StreamSG", email = "mccarthyaaron0604@gmail.com" }
]
keywords = [
    "loupedeck",
    "razer-stream-controller",
    "stream-deck",
    "linux",
    "pipewire",
    "obs-studio",
    "pyqt6"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Mixers",
    "Topic :: System :: Hardware :: Hardware Drivers"
]
dependencies = [
    "pyserial>=3.5",
    "websockets>=11.0",
    "numpy>=1.24.0",
    "Pillow>=10.0.0",
    "psutil>=5.9.0",
    "PyQt6>=6.4.0"
]

[project.urls]
Homepage = "https://github.com/StreamSG/LinuxDeck"
Repository = "https://github.com/StreamSG/LinuxDeck"
Issues = "https://github.com/StreamSG/LinuxDeck/issues"

[project.scripts]
linuxdeck = "linuxdeck.__main__:main"

[tool.setuptools.packages.find]
include = ["linuxdeck*"]

[tool.setuptools.package-data]
linuxdeck = ["assets/*.png"]
